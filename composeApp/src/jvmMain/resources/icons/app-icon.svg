<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Artistic Dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b1055;stop-opacity:1" /> <!-- Dark Violet -->
      <stop offset="100%" style="stop-color:#7597de;stop-opacity:1" /> <!-- Soft Blue -->
    </linearGradient>
    
    <!-- Shadow for depth -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Glossy Highlight Gradient -->
    <linearGradient id="gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:0.2" />
      <stop offset="100%" style="stop-color:#fff;stop-opacity:0.0" />
    </linearGradient>
  </defs>

  <!-- Base Shape: Squircle -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bgGrad)" filter="url(#shadow)"/>
  
  <!-- Subtle Top Gloss -->
  <rect x="100" y="100" width="824" height="412" rx="185" fill="url(#gloss)" />

  <!-- Central Composition: Abstract Aperture -->
  <g transform="translate(512, 512)">
    <!-- Rotating Blades -->
    <!-- Blade 1: Cyan -->
    <path d="M0 -250 C 150 -250, 250 -150, 250 0 L 0 0 Z" fill="#00f2ea" opacity="0.8" transform="rotate(0)"/>
    <!-- Blade 2: Purple -->
    <path d="M0 -250 C 150 -250, 250 -150, 250 0 L 0 0 Z" fill="#ff0055" opacity="0.8" transform="rotate(60)"/>
    <!-- Blade 3: Yellow -->
    <path d="M0 -250 C 150 -250, 250 -150, 250 0 L 0 0 Z" fill="#ffcc00" opacity="0.8" transform="rotate(120)"/>
    <!-- Blade 4: Green -->
    <path d="M0 -250 C 150 -250, 250 -150, 250 0 L 0 0 Z" fill="#00ff66" opacity="0.8" transform="rotate(180)"/>
    <!-- Blade 5: Blue -->
    <path d="M0 -250 C 150 -250, 250 -150, 250 0 L 0 0 Z" fill="#0099ff" opacity="0.8" transform="rotate(240)"/>
    <!-- Blade 6: Orange -->
    <path d="M0 -250 C 150 -250, 250 -150, 250 0 L 0 0 Z" fill="#ff6600" opacity="0.8" transform="rotate(300)"/>

    <!-- Center Eye/Lens -->
    <circle cx="0" cy="0" r="80" fill="#ffffff" />
    <circle cx="0" cy="0" r="60" fill="#2b1055" />
    <!-- Recording Dot -->
    <circle cx="0" cy="0" r="30" fill="#ff3b30" />
  </g>
  
</svg>