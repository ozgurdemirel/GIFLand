<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Ring (Camera Lens) -->
  <circle cx="12" cy="12" r="9" stroke="black" stroke-width="2" />
  
  <!-- Inner Dot (Recording Sensor) -->
  <circle cx="12" cy="12" r="4" fill="black"/>
  
  <!-- Lens Reflection / Glint (Stylized) -->
  <path d="M6 6 Q9 3 12 4.5" stroke="black" stroke-width="1.5" stroke-linecap="round" opacity="0.0"/> 
  <!-- Reflection is often omitted in small monochrome icons for clarity, 
       but keeping the geometry simple is best. 
       Let's add a small cut or detail to make it look like the app icon. -->
       
  <!-- Alternative: The "G" style gap or reflection -->
  <path d="M 5.5 5.5 Q 8.5 2.5 12 4" stroke="white" stroke-width="1" stroke-linecap="round" opacity="0.5" />
</svg>